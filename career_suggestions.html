<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Career Suggestions | Career Guidance</title>
  <style>
    :root{
      --bg-1: #0b1220;
      --bg-2: #0f1724;
      --accent: #34D399;
      --muted: rgba(255,255,255,0.90);
      --glass-border: rgba(255,255,255,0.06);
      --radius: 14px;
      --shadow: 0 12px 40px rgba(2,6,23,0.6);
      --font-sans: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%}

    body {
      font-family:var(--font-sans);
      margin: 0;
      padding: 0;
      display: flex;
      color: var(--muted);
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(110,231,183,0.06), transparent 8%),
        radial-gradient(800px 400px at 90% 90%, rgba(99,102,241,0.03), transparent 6%),
        linear-gradient(180deg,var(--bg-1),var(--bg-2));
      background-attachment: fixed;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Sidebar */
    .sidebar {
      position:fixed;
      left:24px;
      top:24px;
      width:220px;
      height:calc(100vh - 48px);
      background: linear-gradient(180deg, rgba(110,231,183,0.04), rgba(110,231,183,0.01));
      border-radius:var(--radius);
      border:1px solid var(--glass-border);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
      box-shadow:var(--shadow);
      color:var(--accent);
      z-index:60;
      backdrop-filter: blur(6px) saturate(120%);
      font-weight:600;
    }
    .sidebar .logo{
      width:56px;height:56px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      font-weight:800;font-size:20px;color:#042;
      background:linear-gradient(90deg,#34D399,#34D399);
      box-shadow:0 8px 20px rgba(16,24,32,0.45);
      margin-bottom:6px;
    }
    .sidebar h2 {
      font-size:18px;margin:0 0 4px 0;color:var(--accent);font-weight:800;
    }
    .sidebar p{font-size:13px;color:rgba(255,255,255,0.9);margin-bottom:6px}
    .sidebar a {
      display:block;color:var(--muted);padding:8px 10px;text-decoration:none;border-radius:8px;font-size:13px;
      transition:background .15s,color .15s,transform .12s;margin-top:6px;
    }
    .sidebar a:hover {
      background:rgba(110,231,183,0.08);color:var(--accent);transform:translateY(-2px);
    }

    /* Main Content */
    .content {
      margin-left: 272px;
      padding: 40px 28px;
      flex: 1;
      box-sizing: border-box;
      width:100%;
      max-width:1100px;
    }

    .page-title {
      text-align: left;
      font-size: 28px;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight:800;
    }

    /* Form Container */
    .form-container {
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      box-sizing: border-box;
      border:1px solid rgba(255,255,255,0.03);
      box-shadow:0 8px 30px rgba(2,6,23,0.25);
    }

  
    select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border:1px solid rgba(2,6,23,0.08);
      font-size: 16px;
      background:rgba(255,255,255,0.02);
      color: var(--muted);
      margin-bottom: 15px;
      font-family:var(--font-sans);
      -webkit-appearance: none;
      appearance: none;
    }
    select option {
      background-color: var(--bg-1);
      color: var(--muted);
      padding: 10px;
    }
    select:focus, textarea:focus{
      outline:none;background:rgba(255,255,255,0.03);border-color:rgba(110,231,183,0.3);
    }


    button {
      background:linear-gradient(90deg,var(--accent),#34D399);
      color: #042;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.3s ease;
    }

    button:hover {
      opacity: 0.95;
    }

    #suggestions {
      margin-top: 20px;
      padding: 20px;
      background: rgba(255,255,255,0.01);
      border-left: 4px solid rgba(110,231,183,0.18);
      border-radius: 8px;
      font-size: 16px;
      color: rgba(255,255,255,0.9);
      white-space: pre-line;
      line-height: 1.6;
      min-height:60px;
    }

    @media (max-width:900px){
      .sidebar{display:none}
      .content{margin-left:24px;padding:24px}
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">CG</div>
    <h2>CareerCanvas</h2>
    <p>Design your path — build your future.</p>
    <small style="color:rgba(255,255,255,0.7);margin-top:auto">Resume · Internships · Roadmaps</small>
    <div style="width:100%;border-top:1px solid rgba(110,231,183,0.08);margin:12px 0;"></div>
    <a href="dashboard.html">🏠 Home</a>
    <a href="add_goal.html">➕ Add Goal</a>
    <a href="goals_list.html">📋 View Goals</a>
    <a href="career_suggestions.html">💡 Career Suggestions</a>
    <a href="roadmap_generator.html">🛣️ Roadmap Generator</a>
    <a href="skills_recommendation.html">🎯 Skills Recommendation</a>
    <a href="project_ideas.html">🚀 Project Ideas</a>
    <a href="internship_alerts.html">💼 Internship Alerts</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h2 class="page-title">Enter Your Stream & Interests</h2>

    <div class="form-container">
      <form id="interestForm">
        <select id="stream" name="stream" required>
          <option value="">-- Select Your Stream --</option>
          <option value="CSE">Computer Science</option>
          <option value="ECE">Electronics & Communication</option>
          <option value="EEE">Electrical</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Civil">Civil</option>
          <option value="Commerce">Commerce</option>
          <option value="Arts">Arts</option>
          <option value="Science">Science</option>
          <option value="Other">Other</option>
        </select>

        <textarea id="interests" name="interests" placeholder="e.g. Python, Web Development, Machine Learning" required></textarea>
        <button type="submit">Get Career Suggestions</button>
      </form>

      <div id="suggestions"></div>
    </div>
  </div>

  <script>
    // ...existing code...
    document.getElementById('interestForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const interests = document.getElementById('interests').value.trim();
      const stream = document.getElementById('stream').value;

      fetch('get_suggestions.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: 'stream=' + encodeURIComponent(stream) + '&interests=' + encodeURIComponent(interests)
      })
      .then(response => response.text())
      .then(data => {
        document.getElementById('suggestions').innerText = data;
      })
      .catch(error => {
        document.getElementById('suggestions').innerText = "❌ Failed to fetch suggestions. Please try again later.";
      });
    });
    // ...existing code...
  </script>

</body>
</html>
