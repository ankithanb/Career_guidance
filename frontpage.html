<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Guidance Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header/Navigation */
        nav {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav h3 {
            color: white;
            font-size: 1.5em;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 0.95em;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffd700;
        }

        /* Main Content */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .hero-section h2 {
            font-size: 2.5em;
            margin-bottom: 15px;
            animation: fadeIn 1s ease-in-out forwards;
        }

        .logo-container img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            animation: zoomIn 1.5s ease-in-out forwards;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .hero-section h1 {
            font-size: 3em;
            margin-bottom: 25px;
            animation: fadeIn 1s ease-in-out 0.5s forwards;
            opacity: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .hero-section p {
            font-size: 1.2em;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in-out 1s forwards;
            opacity: 0;
            max-width: 600px;
        }

        .btn-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 1s ease-in-out 1.5s forwards;
            opacity: 0;
        }

        .btn {
            padding: 14px 28px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .signup-btn {
            background-color: #4CAF50;
        }

        .login-btn {
            background-color: #4A90E2;
        }

        .resume-btn {
            background-color: #FF6B6B;
        }

        .internship-btn {
            background-color: #FFA500;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .signup-btn:hover {
            background-color: #388E3C;
        }

        .login-btn:hover {
            background-color: #357ABD;
        }

        .resume-btn:hover {
            background-color: #E63946;
        }

        .internship-btn:hover {
            background-color: #FF8C00;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            nav ul {
                gap: 15px;
                font-size: 0.9em;
            }

            .hero-section h1 {
                font-size: 2em;
            }

            .hero-section h2 {
                font-size: 1.8em;
            }

            .btn-container {
                flex-direction: column;
                align-items: center;
                width: 100%;
                padding: 0 20px;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <h3>🎓 Career Guidance</h3>
        <ul>
            <li><a href="frontpage.html">Home</a></li>
           
            <li><a href="login.html">Dashboard</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <h2>Welcome Aspirants</h2>
        
        <div class="logo-container">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Career Guidance">
        </div>

        <h1>Career Guidance Portal</h1>
        <p>“Engineering is not just about building machines or codes — it’s about building the future : )”</p>

        <div class="btn-container">
           
            <a href="signup.html" class="btn signup-btn">✍️ Sign Up</a>
            <a href="login.html" class="btn login-btn">🔐 Login</a>
        </div>
    </div>

</body>
</html>
