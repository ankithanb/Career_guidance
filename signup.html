<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Admission Portal</title>
    <link rel="stylesheet" href="sstyle.css">
</head>
<body>

<div class="signup-container">
    <h1>Create Your Account</h1>

    <form id="signupForm" action="dashboard.html" method="GET">
        <input type="text" name="fullname" placeholder="Enter your full name" required>
        <input type="email" name="email" placeholder="Enter your email" required>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>

        <!-- Password Field with Eye Icon -->
        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter a password" required>
            <span class="eye-icon" onclick="togglePassword('password', this)">👀</span>
        </div>

        <!-- Confirm Password Field with Eye Icon -->
        <div class="input-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
            <span class="eye-icon" onclick="togglePassword('confirm_password', this)">👀</span>
        </div>

        <!-- Error message -->
        <p id="error-message"></p>

        <button type="submit">Sign Up</button>
        <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
    </form>
</div>

<script>
// Toggle password visibility
function togglePassword(fieldId, icon) {
    const input = document.getElementById(fieldId);
    const type = input.type === 'password' ? 'text' : 'password';
    input.type = type;
    icon.style.color = type === 'text' ? '#007BFF' : '#555';
}

// Password match check
document.getElementById('signupForm').addEventListener('submit', function(event) {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;
    const errorMessage = document.getElementById('error-message');

    if (password !== confirm) {
        event.preventDefault(); // stop form submission
        errorMessage.textContent = 'Password is not matching, please try again';
        errorMessage.style.color = 'red';
    } else {
        errorMessage.textContent = '';
    }
});
</script>

</body>
</html>
