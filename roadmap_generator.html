<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Career Roadmap Generator</title>
  <style>
    :root{
      --bg-1: #0b1220;
      --bg-2: #0f1724;
      --accent: #34D399;
      --muted: rgba(255,255,255,0.90);
      --glass-border: rgba(255,255,255,0.06);
      --radius: 14px;
      --shadow: 0 12px 40px rgba(2,6,23,0.6);
      --font-sans: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%}

    body{
      font-family:var(--font-sans);
      color:var(--muted);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      position:relative;
      background:
        radial-gradient(1200px 600px at 10% 10%, rgba(110,231,183,0.06), transparent 8%),
        radial-gradient(800px 400px at 90% 90%, rgba(99,102,241,0.03), transparent 6%),
        linear-gradient(180deg,var(--bg-1),var(--bg-2));
      background-attachment: fixed;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* Sidebar (project-ideas style) */
    .sidebar{
      position:fixed;
      left:24px;
      top:24px;
      width:220px;
      height:calc(100vh - 48px);
      background: linear-gradient(180deg, rgba(110,231,183,0.04), rgba(110,231,183,0.01));
      border-radius:var(--radius);
      border:1px solid var(--glass-border);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:12px;
      box-shadow:var(--shadow);
      color:var(--accent);
      z-index:60;
      backdrop-filter: blur(6px) saturate(120%);
      font-weight:600;
    }
    .sidebar .logo{
      width:56px;height:56px;border-radius:10px;
      display:inline-flex;align-items:center;justify-content:center;
      font-weight:800;font-size:20px;color:#042;
      background:linear-gradient(90deg,#34D399,#34D399);
      box-shadow:0 8px 20px rgba(16,24,32,0.45);
      margin-bottom:6px;
    }
    .sidebar h2{font-size:18px;margin:0 0 4px 0;color:var(--accent);font-weight:800}
    .sidebar p{font-size:13px;color:rgba(255,255,255,0.9);margin-bottom:6px}
    .sidebar a{
      display:block;color:var(--muted);padding:8px 10px;text-decoration:none;border-radius:8px;font-size:13px;
      transition:background .15s,color .15s,transform .12s;margin-top:6px;
    }
    .sidebar a:hover{background:rgba(110,231,183,0.08);color:var(--accent);transform:translateY(-2px)}

    /* Main content */
    .content{
      width:100%;
      max-width:1100px;
      margin-left:272px; /* sidebar width + gap */
      padding:40px 28px;
      box-sizing:border-box;
    }

    h1{color:var(--accent);font-size:28px;margin-bottom:20px;font-weight:800}

    .form-container{
      margin-top:18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.03);
      padding:20px;
      box-shadow:0 8px 30px rgba(2,6,23,0.25);
      margin-bottom:20px;
    }

    label{
      display:block;
      margin-bottom:10px;
      color:rgba(255,255,255,0.85);
      font-weight:600;
      font-size:14px;
    }

    input{
      padding:12px;
      margin:10px 0;
      width:100%;
      border:1px solid rgba(2,6,23,0.08);
      border-radius:8px;
      background:rgba(255,255,255,0.02);
      color:var(--muted);
      font-family:var(--font-sans);
      box-sizing:border-box;
    }
    input::placeholder{color:rgba(255,255,255,0.5)}
    input:focus{outline:none;background:rgba(255,255,255,0.03);border-color:rgba(110,231,183,0.3)}

    button{
      padding:14px;
      margin:10px 0;
      width:100%;
      border:none;
      border-radius:10px;
      background:linear-gradient(90deg,var(--accent),#34D399);
      color:#042;
      font-weight:800;
      font-size:16px;
      cursor:pointer;
      font-family:var(--font-sans);
    }
    button:hover{opacity:0.95}

    .roadmap-output{
      background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      padding:20px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.03);
      white-space:pre-wrap;
      line-height:1.6;
      color:rgba(255,255,255,0.9);
      border-left:4px solid rgba(110,231,183,0.18);
      min-height:120px;
    }

    @media (max-width:900px){
      .sidebar{display:none}
      .content{margin-left:24px;padding:24px}
    }
  </style>
</head>
<body>
  <!-- Sidebar Navigation -->
  <div class="sidebar">
    <div class="logo">CG</div>
    <h2>CareerCanvas</h2>
    <p>Design your path — build your future.</p>
    <small style="color:rgba(255,255,255,0.7);margin-top:auto">Resume · Internships · Roadmaps</small>
    <div style="width:100%;border-top:1px solid rgba(110,231,183,0.08);margin:12px 0;"></div>

    <a href="dashboard.html">🏠 Home</a>
    <a href="add_goal.html">➕ Add Goal</a>
    <a href="goals_list.html">📋 View Goals</a>
    <a href="career_suggestions.html">💡 Career Suggestions</a>
    <a href="roadmap_generator.html">🛣️ Roadmap Generator</a>
    <a href="skills_recommendation.html">🎯 Skills Recommendation</a>
    <a href="project_ideas.html">🚀 Project Ideas</a>
    <a href="internship_alerts.html">💼 Internship Alerts</a>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h1>Career Roadmap Generator</h1>
    <div class="form-container">
      <label for="goal">Enter Your Career Goal:</label>
      <input type="text" id="goal" placeholder="e.g., Java Developer">
      <button onclick="generateRoadmap()">Generate Roadmap</button>
    </div>
    <div class="roadmap-output" id="roadmapOutput">
      Your roadmap will appear here...
    </div>
  </div>

  <script>
    // ...existing code...
    function generateRoadmap() {
      const goal = document.getElementById('goal').value.trim();
      const outputDiv = document.getElementById('roadmapOutput');

      if (!goal) {
        outputDiv.textContent = "⚠️ Please enter a goal.";
        return;
      }

      outputDiv.textContent = "⏳ Generating roadmap...";

      fetch('roadmap_api.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'goal=' + encodeURIComponent(goal)
      })
      .then(response => response.json())
      .then(data => {
        if (data.error) {
          outputDiv.textContent = "❌ Error: " + data.error;
        } else {
          outputDiv.textContent = data.roadmap;
        }
      })
      .catch(err => {
        outputDiv.textContent = "❌ Request failed: " + err;
      });
    }
    // ...existing code...
  </script>
</body>
</html>
